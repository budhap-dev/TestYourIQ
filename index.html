<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A free, timed reasoning test that estimates your IQ against people of your own age. An estimate, not a diagnosis."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Test Your IQ · A careful IQ estimate</title>
    <script>
      // Apply a stored theme choice before first paint to avoid a flash.
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('theme');
          var p = localStorage.getItem('palette');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
          if (p && /^[a-z]+$/.test(p)) d.dataset.palette = p;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

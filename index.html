<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A free, timed reasoning test that estimates your IQ against people of your own age. An estimate, not a diagnosis."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13100b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="unIQo" />
    <!-- Link previews (WhatsApp, iMessage, Slack, social). %SITE_URL% is filled in by vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="unIQo" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="unIQo · A careful IQ estimate" />
    <meta
      property="og:description"
      content="A free, timed reasoning test with original puzzles. See how you compare with people your own age."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="unIQo: a careful estimate of how you reason. A three-by-three puzzle grid with the last square missing."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>unIQo · A careful IQ estimate</title>
    <script>
      // Apply a stored theme choice before first paint to avoid a flash.
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('theme');
          var p = localStorage.getItem('palette');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
          if (p && /^[a-z]+$/.test(p)) d.dataset.palette = p;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
